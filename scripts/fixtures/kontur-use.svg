<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100mm" height="60mm" viewBox="0 0 100 60">
  <!-- Umriss als Vorlage, gezeichnet über <use> (verschoben und um 90° gedreht): 30 × 44 mm -->
  <defs><rect id="haube" x="0" y="0" width="44" height="30" rx="4"/></defs>
  <use href="#haube" x="0" y="0" transform="translate(70 5) rotate(90)"/>
</svg>
