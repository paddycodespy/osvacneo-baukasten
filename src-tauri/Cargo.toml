[package]
name = "osvacneo-baukasten"
version = "0.2.0"
description = "osVAC neo Baukasten als Desktop-Programm"
authors = ["paddycodespy"]
license = "CC-BY-NC-SA-4.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "osvacneo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# kleines, schnelles Programm (die eigentliche Arbeit macht die Web-Oberfläche)
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
