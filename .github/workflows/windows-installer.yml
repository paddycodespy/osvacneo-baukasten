# Baut den Windows-Installer (NSIS, .exe) des osVAC neo Baukastens.
# Start: auf GitHub unter „Actions“ → „Windows-Installer“ → „Run workflow“ (zum Testen),
# oder über release.yml bei einem Versions-Tag (dann landet die Datei zusätzlich im Release).
# Ergebnis: unter dem Lauf bei „Artifacts“ das ZIP „osVAC-neo-Baukasten-<Version>-Windows“ mit
# osVAC-neo-Baukasten-<Version>-Windows-Setup.exe (gleiches Schema wie macOS und Linux).
name: Windows-Installer

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # baut zuerst die Web-Oberfläche (npm run build), dann das Programm und den Installer
      - run: npx tauri build --bundles nsis

      # einheitliche Dateinamen für alle Systeme: osVAC-neo-Baukasten-<Version>-<System>.<Endung>
      - name: Dateien benennen
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          mkdir -p out
          mv src-tauri/target/release/bundle/nsis/*.exe "out/osVAC-neo-Baukasten-$v-Windows-Setup.exe"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          ls -l out

      - uses: actions/upload-artifact@v6
        with:
          name: osVAC-neo-Baukasten-${{ env.VERSION }}-Windows
          path: out/*
          if-no-files-found: error
