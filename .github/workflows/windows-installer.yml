# Baut den Windows-Installer (NSIS, .exe) des osVAC neo Baukastens.
# Start: auf GitHub unter „Actions“ → „Windows-Installer“ → „Run workflow“,
# oder automatisch beim Hochladen eines Versions-Tags (z. B. git tag v0.1.0 && git push --tags).
# Ergebnis: unter dem Lauf bei „Artifacts“ als ZIP mit der Setup-Datei.
name: Windows-Installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # baut zuerst die Web-Oberfläche (npm run build), dann das Programm und den Installer
      - run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v6
        with:
          name: osVAC-neo-Baukasten-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
