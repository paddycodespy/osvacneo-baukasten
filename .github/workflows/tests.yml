# Prüft jede Änderung: Typen, Build, Cache-Schlüssel, Freiform-Rechnung, Skizzen, Bedienabläufe, Geometrie aller Adapter, Druckbarkeit und ob die Anleitungsbilder aktuell sind.
# Start von Hand („Actions“ → „Tests“ → „Run workflow“) oder über release.yml vor jedem Release.
# Die Gruppen laufen gleichzeitig (Freiform in zwei Hälften).
name: Tests

# Nicht bei jedem Push: die Tests laufen vor jedem Patch ohnehin lokal. Ein Release wird nur veröffentlicht,
# wenn alle Tests grün sind (release.yml ruft diesen Workflow auf).
on:
  workflow_dispatch:
  workflow_call:

# Je Branch läuft höchstens ein Testlauf; kommt ein neuer Push, während einer wartet, ersetzt der neue den wartenden
# (der laufende wird zu Ende geführt). Jeder Lauf prüft den ganzen Stand, also auch die übersprungenen Änderungen.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  oberflaeche:
    name: Typen, Build, Skizzen, Bedienung
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typen prüfen
        run: npm run check

      - name: Web-Oberfläche bauen
        run: npm run build

      # Chrome ist auf den GitHub-Rechnern vorinstalliert
      - name: Skizzen ohne Überschneidungen
        run: npm run test:sketches
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Bedienabläufe im Browser
        run: npm run test:ui
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # Bildschirmfotos fehlgeschlagener Abläufe zum Herunterladen
      - name: Bildschirmfotos bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-bildschirmfotos
          path: out/ui-*.png
          if-no-files-found: ignore

  # Freiform in zwei Hälften gleichzeitig (die Schieber-Fälle machen die Rechnung lang)
  freiform:
    name: Cache-Schlüssel, Freiform ${{ matrix.teil }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Cache-Schlüssel
        if: matrix.teil == 1
        run: npm run test:keys

      - name: Freiform-Rechnung
        run: npx tsx scripts/freeform.ts --teil=${{ matrix.teil }}/2

  geometrie:
    name: Geometrie aller Adapter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # dauert am längsten: alle Adaptertypen und Größen mit dem CAD-Kern
      - name: Geometrie aller Adapter
        run: npm run test:geometry

  # Druckbarkeit: Netze geschlossen, nichts beginnt frei in der Luft, wo die App „ohne Stützen“ sagt
  druck:
    name: Druckbarkeit (Schichten)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install trimesh shapely rtree networkx scipy

      - name: Schichten prüfen
        run: npm run test:islands

      - name: Druckoptimierter Drehring
        run: npm run test:swivel

      - name: Nebenluft-Ring
        run: npm run test:bleed

  # Anleitungsbilder: Sind sie noch aktuell? Chrome zeichnet auf GitHub minimal anders als lokal (Kantenglättung, Schrift),
  # ein Vergleich mit public/anleitung/ meldet deshalb fast jedes Bild. Stattdessen werden auf GitHub zwei Stände
  # aufgenommen: der aktuelle und der, bei dem public/anleitung/ zuletzt geändert wurde. Unterscheiden sich die beiden,
  # hat sich die App seitdem sichtbar geändert und das Bild ist veraltet. Nur Warnung, ein Release wird nicht blockiert.
  anleitung-aufnahme:
    name: Anleitungsbilder aufnehmen (${{ matrix.stand }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        stand: [neu, basis]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Stand der letzten Bilder auschecken
        if: matrix.stand == 'basis'
        run: |
          BASE=$(git log -1 --format=%H -- public/anleitung/)
          echo "Bilder zuletzt geändert in $(git log -1 --format='%h %s' $BASE)"
          git checkout -q "$BASE"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install pillow numpy
      - name: Web-Oberfläche bauen
        run: npm run build
      - name: Bilder aufnehmen
        # GITHUB_ACTIONS leer: der Vergleich mit public/anleitung/ im Skript gibt dann keine Warnungen aus
        run: npx tsx scripts/anleitung-bilder.ts --pruefen
        env:
          CHROME_PATH: /usr/bin/google-chrome
          GITHUB_ACTIONS: ''
      - uses: actions/upload-artifact@v6
        with:
          name: anleitung-${{ matrix.stand }}
          path: out/anleitung/*.webp

  anleitung:
    name: Anleitungsbilder aktuell?
    needs: anleitung-aufnahme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pillow numpy
      - uses: actions/download-artifact@v8
        with:
          name: anleitung-basis
          path: out/basis
      - uses: actions/download-artifact@v8
        with:
          name: anleitung-neu
          path: out/neu
      - name: Vergleichen
        run: python3 tools/anleitung/vergleich.py out/basis out/neu --github
