name: macOS-Installer

# Baut ein DMG für macOS (Universal: Apple Silicon und Intel).
# Start über „Run workflow“ (zum Testen) oder über release.yml bei einem Versions-Tag (dann auch im Release).
# Ergebnis: Artefakt „osVAC-neo-Baukasten-<Version>-macOS“ mit osVAC-neo-Baukasten-<Version>-macOS.dmg
# (gleiches Schema wie Windows und Linux).

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Abhängigkeiten
        run: npm ci

      - name: App und DMG bauen
        run: npx tauri build --target universal-apple-darwin

      # einheitliche Dateinamen für alle Systeme: osVAC-neo-Baukasten-<Version>-<System>.<Endung>
      - name: Dateien benennen
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          mkdir -p out
          mv src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/osVAC-neo-Baukasten-$v-macOS.dmg"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          ls -l out

      - uses: actions/upload-artifact@v6
        with:
          name: osVAC-neo-Baukasten-${{ env.VERSION }}-macOS
          path: out/*
          if-no-files-found: error
