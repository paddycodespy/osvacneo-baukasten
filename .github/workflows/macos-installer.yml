name: macOS-Installer

# Baut ein DMG für macOS (Universal: Apple Silicon und Intel).
# Start über „Run workflow“ oder durch einen Tag v*.
# Ergebnis: Artefakt „osvacneo-konfigurator-macos“ mit der .dmg-Datei.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Abhängigkeiten
        run: npm ci

      - name: App und DMG bauen
        run: npx tauri build --target universal-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: osvacneo-konfigurator-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
