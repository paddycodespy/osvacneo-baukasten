# Baut den osVAC neo Baukasten für Linux: AppImage (läuft ohne Installation auf den meisten Distributionen)
# und .deb (Debian, Ubuntu, Linux Mint).
# Start: auf GitHub unter „Actions“ → „Linux-Installer“ → „Run workflow“ (zum Testen),
# oder über release.yml bei einem Versions-Tag (dann landen die Dateien zusätzlich im Release).
# Ergebnis: Artefakt „osVAC-neo-Baukasten-<Version>-Linux“ mit osVAC-neo-Baukasten-<Version>-Linux.AppImage
# und osVAC-neo-Baukasten-<Version>-Linux.deb (gleiches Schema wie Windows und macOS).
# Gebaut auf Ubuntu 22.04: das AppImage läuft dann auch auf älteren Systemen (glibc 2.35 und neuer).
name: Linux-Installer

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # WebKitGTK und Werkzeuge für das AppImage
      - name: Systempakete
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - run: npm ci

      # baut zuerst die Web-Oberfläche (npm run build), dann das Programm, AppImage und .deb
      - run: npx tauri build --bundles appimage,deb

      # einheitliche Dateinamen für alle Systeme: osVAC-neo-Baukasten-<Version>-<System>.<Endung>
      - name: Dateien benennen
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          mkdir -p out
          mv src-tauri/target/release/bundle/appimage/*.AppImage "out/osVAC-neo-Baukasten-$v-Linux.AppImage"
          mv src-tauri/target/release/bundle/deb/*.deb "out/osVAC-neo-Baukasten-$v-Linux.deb"
          chmod +x out/*.AppImage
          echo "VERSION=$v" >> "$GITHUB_ENV"
          ls -l out

      - uses: actions/upload-artifact@v6
        with:
          name: osVAC-neo-Baukasten-${{ env.VERSION }}-Linux
          path: out/*
          if-no-files-found: error
